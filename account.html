<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>حساب کاربری | کابل‌وب</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap {
      max-width: 420px;
      margin: 3rem auto;
      padding: 2rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .auth-wrap h1 {
      color: var(--gold);
      font-size: 1.4rem;
      margin-bottom: .5rem;
    }
    .auth-wrap .muted { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: .88rem; color: var(--muted); margin-bottom: .3rem; }
    .field input {
      width: 100%;
      padding: .7rem .95rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b1222;
      color: var(--text);
      outline: none;
    }
    .field input:focus { border-color: var(--gold); }
    .btn-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
    .back { display: block; text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: .9rem; }
    .back:hover { color: var(--gold); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="kabulweb-logo.jpg" alt="KabulWeb" class="logo-img" width="48" height="48"
             onerror="this.style.display='none'">
        <span class="logo-text">
          <strong>کابل‌وب</strong>
          <small>حساب کاربری</small>
        </span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline">بازگشت به بازار</a>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrap">
      <h1>حساب کابل‌وب</h1>
      <p class="muted">وارد حساب خود شوید یا حساب جدید بسازید.</p>

      <form id="authForm">
        <div class="field">
          <label for="email">ایمیل</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <input type="password" id="password" required minlength="6" autocomplete="current-password" />
        </div>
        <div class="field" id="nameField" style="display:none">
          <label for="name">نام کامل</label>
          <input type="text" id="name" maxlength="80" />
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="submitBtn">ورود</button>
          <button type="button" class="btn btn-secondary" id="toggleBtn">ساخت حساب جدید</button>
        </div>
      </form>
      <a href="index.html" class="back">← بازگشت به صفحه اصلی</a>
    </div>
  </main>

  <script>
    const form = document.getElementById("authForm");
    const toggle = document.getElementById("toggleBtn");
    const submit = document.getElementById("submitBtn");
    const nameField = document.getElementById("nameField");
    let isSignup = false;

    toggle.addEventListener("click", () => {
      isSignup = !isSignup;
      nameField.style.display = isSignup ? "block" : "none";
      submit.textContent = isSignup ? "ثبت‌نام" : "ورود";
      toggle.textContent = isSignup ? "قبلاً حساب دارید؟ ورود" : "ساخت حساب جدید";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      alert(isSignup
        ? "ثبت‌نام شبیه‌سازی شد. اتصال Supabase Auth به‌زودی فعال می‌شود."
        : "ورود شبیه‌سازی شد. اتصال Supabase Auth به‌زودی فعال می‌شود.");
    });
  </script>
</body>
</html>
