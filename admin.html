<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1020">
<title>پنل مدیریت | کابل‌وب</title>
<link rel="icon" href="file_0000000065308243bcbdb432d1ef6885.png" type="image/png">
<style>
:root { color-scheme: dark; --bg: #0b1020; --card: #121b30; --border: #293954; --text: #f5f7ff; --muted: #aab7cf; --gold: #f3c969; --gold2: #ffe6a0; --primary: #f3c969; --danger: #a82f48; --success: #147d61; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: Tahoma, Arial, "Segoe UI", sans-serif; line-height: 1.8; }
.container { max-width: 1100px; margin: auto; }
h1, h2 { margin-top: 0; color: var(--gold); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
input, select, textarea, button { font: inherit; }
input, select, textarea { width: 100%; padding: 12px; margin: 7px 0 15px; background: #0b1222; color: var(--text); border: 1px solid var(--border); border-radius: 9px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
button { border: 0; border-radius: 9px; padding: 10px 16px; margin: 4px; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #151a26; font-weight: 700; }
button:disabled { opacity: 0.5; cursor: wait; }
.danger { background: var(--danger); color: #fff; }
.success { background: var(--success); color: #fff; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.tabs button { flex: 1; min-width: 120px; background: #17243c; color: var(--text); border: 1px solid var(--border); font-weight: 600; }
.tabs button.active { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #151a26; border-color: transparent; }
.item { background: #0b1222; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin: 12px 0; overflow-wrap: anywhere; }
.item p { margin: 5px 0; }
.item-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 12px; }
.item-actions select { flex: 1; min-width: 150px; margin: 0; }
.status { color: var(--gold); font-weight: bold; }
#message { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
#message:empty { display: none; }
.error { background: #48202b; color: #ffbdc7; }
.info { background: #1c304c; color: #d5e5ff; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
a { color: var(--gold); }
a:hover { color: var(--gold2); }
@media (max-width: 600px) { body { padding: 10px; } .card { padding: 14px; } .tabs { flex-direction: column; } .tabs button { width: 100%; } }
</style>
</head>
<body>
<main class="container">
  <div class="topbar">
    <h1>پنل مدیریت کابل‌وب</h1>
    <a href="./index.html">مشاهدهٔ سایت</a>
  </div>
  <p class="muted">مدیریت درخواست‌ها. فقط دو ایمیل مجاز مدیر. امنیت با RPC و RLS سمت سرور.</p>
  <div id="message" role="status" aria-live="polite"></div>
  <section id="loginCard" class="card">
    <h2>ورود مدیر</h2>
    <form id="loginForm">
      <label for="email">ایمیل حساب مدیر</label>
      <input id="email" type="email" autocomplete="username" required placeholder="ایمیل حساب Supabase">
      <label for="password">رمز عبور</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="رمز عبور حساب">
      <button id="loginButton" type="submit">ورود به پنل</button>
    </form>
    <p class="muted">دسترسی با <code>is_kabulweb_admin</code> بررسی می‌شود.</p>
  </section>
  <section id="dashboard" class="hidden">
    <div class="card">
      <div class="topbar">
        <div><h2>داشبورد مدیریت</h2><span id="adminEmail" class="muted"></span></div>
        <button id="logoutButton" class="danger" type="button">خروج امن</button>
      </div>
      <div class="tabs">
        <button type="button" data-table="ad_requests" class="active">تبلیغات</button>
        <button type="button" data-table="listings">محصولات</button>
        <button type="button" data-table="customer_orders">سفارش‌ها</button>
        <button type="button" data-table="job_posts">کاریابی</button>
      </div>
      <button id="refreshButton" class="success" type="button">تازه‌سازی</button>
      <p id="recordCount" class="muted"></p>
      <div id="records"></div>
    </div>
  </section>
</main>
<script type="module">
import { supabase } from "./js/supabase.js";
const $ = (id) => document.getElementById(id);
const loginCard = $("loginCard");
const dashboard = $("dashboard");
const records = $("records");
const message = $("message");
let currentTable = "ad_requests";
let busy = false;
const ALLOWED_ADMIN_EMAILS = ["hafizullahahmadi715@gmail.com", "jahangirahmadi2003@gmail.com"];
const tableConfig = {
  ad_requests: { title: "تبلیغات", columns: [["name","نام"],["contact","تماس"],["platform","پلتفرم"],["link","لینک"],["description","توضیحات"],["package","بسته"],["status","وضعیت"],["created_at","تاریخ"]], statuses: ["pending","approved","rejected","completed"] },
  listings: { title: "محصول", columns: [["seller_name","فروشنده"],["contact","تماس"],["title","عنوان"],["category","دسته"],["listing_type","نوع"],["description","توضیحات"],["price","قیمت"],["currency","واحد"],["image_url","تصویر"],["status","وضعیت"],["created_at","تاریخ"]], statuses: ["pending","approved","rejected"] },
  customer_orders: { title: "سفارش", columns: [["listing_id","آگهی"],["customer_name","مشتری"],["contact","تماس"],["quantity","تعداد"],["message","پیام"],["status","وضعیت"],["created_at","تاریخ"]], statuses: ["pending","confirmed","completed","cancelled"] },
  job_posts: { title: "وظیفه", columns: [["title","عنوان"],["company","شرکت"],["location","محل"],["type","نوع"],["salary","معاش"],["deadline","مهلت"],["description","توضیحات"],["contact","تماس"],["status","وضعیت"],["created_at","تاریخ"]], statuses: ["pending","approved","rejected"] },
};
function showMessage(text, isError = false) { message.textContent = text; message.className = isError ? "error" : "info"; }
function clearMessage() { message.textContent = ""; message.className = ""; }
function formatValue(value) { if (value === null || value === undefined || value === "") return "—"; if (typeof value === "object") return JSON.stringify(value); return String(value); }
function addText(parent, tag, text, className = "") { const el = document.createElement(tag); el.textContent = text; if (className) el.className = className; parent.appendChild(el); return el; }
function addSafeLink(parent, value) {
  const text = formatValue(value);
  try {
    const url = new URL(text);
    if (url.protocol !== "https:" && url.protocol !== "http:") { addText(parent, "span", text); return; }
    const link = document.createElement("a"); link.href = url.href; link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = "بازکردن لینک"; parent.appendChild(link);
  } catch { addText(parent, "span", text); }
}
function createRecordCard(row, config) {
  const card = document.createElement("article"); card.className = "item";
  addText(card, "h3", config.title + " #" + formatValue(row.id));
  for (const [column, label] of config.columns) {
    const value = row[column];
    if ((column === "link" || column === "image_url") && value) {
      const line = document.createElement("p"); addText(line, "strong", label + ": "); addSafeLink(line, value); card.appendChild(line); continue;
    }
    const line = document.createElement("p"); addText(line, "strong", label + ": "); line.appendChild(document.createTextNode(formatValue(value)));
    if (column === "status") line.className = "status"; card.appendChild(line);
  }
  const actions = document.createElement("div"); actions.className = "item-actions";
  const statusSelect = document.createElement("select"); statusSelect.setAttribute("aria-label", "وضعیت " + formatValue(row.id));
  for (const status of config.statuses) { const option = document.createElement("option"); option.value = status; option.textContent = status; option.selected = status === row.status; statusSelect.appendChild(option); }
  const saveButton = document.createElement("button"); saveButton.type = "button"; saveButton.textContent = "ذخیره";
  saveButton.addEventListener("click", async () => { await updateStatus(row.id, statusSelect.value, saveButton); });
  actions.append(statusSelect, saveButton); card.appendChild(actions); return card;
}
async function verifyAdmin() {
  const { data: { user }, error: userError } = await supabase.auth.getUser();
  if (userError || !user) return false;
  const email = (user.email || "").toLowerCase().trim();
  if (!ALLOWED_ADMIN_EMAILS.includes(email)) return false;
  const { data, error } = await supabase.rpc("is_kabulweb_admin");
  if (error) throw new Error("بررسی دسترسی مدیر ناموفق. docs/security_rls.sql را در Supabase اجرا کنید.");
  return data === true;
}
async function showDashboard() {
  clearMessage();
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) { showMessage("خطا در بررسی نشست.", true); return; }
  if (!session) { loginCard.classList.remove("hidden"); dashboard.classList.add("hidden"); return; }
  let isAdmin = false;
  try { isAdmin = await verifyAdmin(); } catch (err) { showMessage(err.message, true); loginCard.classList.remove("hidden"); dashboard.classList.add("hidden"); return; }
  if (!isAdmin) { await supabase.auth.signOut(); loginCard.classList.remove("hidden"); dashboard.classList.add("hidden"); showMessage("این حساب دسترسی مدیر ندارد.", true); return; }
  loginCard.classList.add("hidden"); dashboard.classList.remove("hidden");
  $("adminEmail").textContent = session.user.email || "مدیر"; await loadRecords();
}
async function loadRecords() {
  if (busy) return; busy = true; clearMessage(); records.replaceChildren(); addText(records, "p", "در حال بارگذاری…", "muted");
  try {
    const config = tableConfig[currentTable];
    const { data, error } = await supabase.from(currentTable).select("*").order("created_at", { ascending: false }).limit(200);
    if (error) throw error;
    records.replaceChildren(); $("recordCount").textContent = "تعداد: " + data.length;
    if (!data.length) { addText(records, "p", "اطلاعاتی نیست.", "muted"); return; }
    for (const row of data) records.appendChild(createRecordCard(row, config));
  } catch (error) { records.replaceChildren(); showMessage("دریافت ناموفق. RLS و دسترسی مدیر را بررسی کنید.", true); console.error(error); }
  finally { busy = false; }
}
async function updateStatus(id, status, button) {
  const config = tableConfig[currentTable];
  if (!config.statuses.includes(status)) { showMessage("وضعیت نامعتبر.", true); return; }
  if (!confirm("تغییر وضعیت به «" + status + "»؟")) return;
  button.disabled = true;
  try {
    const { error } = await supabase.from(currentTable).update({ status }).eq("id", id);
    if (error) throw error;
    showMessage("وضعیت به‌روز شد."); await loadRecords();
  } catch (error) { showMessage("ذخیره ناموفق.", true); console.error(error); }
  finally { button.disabled = false; }
}
$("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault(); const button = $("loginButton"); button.disabled = true; clearMessage();
  try {
    const email = $("email").value.trim(); const password = $("password").value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw new Error("ورود ناموفق. ایمیل و رمز را بررسی کنید.");
    $("password").value = ""; await showDashboard();
  } catch (error) { showMessage(error.message, true); }
  finally { button.disabled = false; }
});
$("logoutButton").addEventListener("click", async () => {
  const { error } = await supabase.auth.signOut();
  if (error) { showMessage("خروج ناموفق.", true); return; }
  records.replaceChildren(); dashboard.classList.add("hidden"); loginCard.classList.remove("hidden"); showMessage("خارج شدید.");
});
document.querySelectorAll("[data-table]").forEach((button) => {
  button.addEventListener("click", async () => {
    currentTable = button.dataset.table;
    document.querySelectorAll("[data-table]").forEach((b) => b.classList.toggle("active", b.dataset.table === currentTable));
    await loadRecords();
  });
});
$("refreshButton").addEventListener("click", loadRecords);
showDashboard();
</script>
</body>
</html>
