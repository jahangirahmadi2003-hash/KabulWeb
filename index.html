<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>KabulWeb | خوش آمدید</title>
<link rel="stylesheet" href="intro.css">
</head>
<body>

<!-- ===== صحنه‌ی آغازین ===== -->
<section id="introStage" class="intro-stage">

  <!-- ذرات نورانی پس‌زمینه -->
  <div class="particles" aria-hidden="true"></div>

  <!-- پرده‌ی راست -->
  <div class="paper right-paper" id="rightPaper">
    <div class="paper-face paper-front"></div>
    <div class="paper-face paper-back">
      <div class="welcome-content">
        <h2 class="welcome-title">کابل‌وب</h2>
        <p class="welcome-sub">به کابل‌وب خوش آمدید</p>
        <p class="welcome-desc">
          کابل‌وب جایی برای رشد کردن، گردهم آمدن،
          رسیدن به بهترین اخبار، منابع آموزشی
          و رشد محصولات.
        </p>
      </div>
    </div>
  </div>

  <!-- پرده‌ی چپ -->
  <div class="paper left-paper" id="leftPaper">
    <div class="paper-face paper-front"></div>
    <div class="paper-face paper-back"></div>
  </div>

  <!-- محتوای روی پرده‌ها (بسم الله) -->
  <div class="bismillah-layer" id="bismillahLayer">
    <h1 class="bismillah-ar" id="bismillahAr">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</h1>
    <p class="bismillah-fa" id="bismillahFa">به نام خداوند بخشنده و مهربان</p>
    <p class="bismillah-en" id="bismillahEn">In the name of Allah, the Most Gracious, the Most Merciful</p>
  </div>

</section>

<!-- دکمه‌ی ورود (بعد از پایان انیمیشن) -->
<div id="enterWrap" class="enter-wrap">
  <button id="enterBtn" class="enter-btn" type="button">ورود به کابل‌وب ←</button>
</div>

<script src="intro.js" defer></script>
</body>
  </html>
