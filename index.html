<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="کابل‌وب؛ بازار افغانستان و جهان برای کاریابی، محصولات، خدمات، تبلیغات کانال‌ها و منابع آموزشی.">
  <title>KabulWeb | بازار افغانستان و جهان</title>

  <link rel="stylesheet" href="intro.css">

  <style>
    :root {
      --bg: #0b1020;
      --panel: #121b30;
      --panel2: #17243c;
      --gold: #f3c969;
      --gold2: #ffe6a0;
      --text: #f5f7ff;
      --muted: #aab7cf;
      --border: #293954;
      --green: #31c48d;
      --blue: #7198ff;
      --red: #ff788b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }

    body.intro-active {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    .intro-stage {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #090e1d;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .intro-stage .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 25%, #f3c96924 0 2px, transparent 3px),
        radial-gradient(circle at 75% 35%, #7198ff25 0 2px, transparent 3px),
        radial-gradient(circle at 40% 75%, #f3c96920 0 2px, transparent 3px),
        radial-gradient(circle at 85% 80%, #7198ff20 0 2px, transparent 3px);
      background-size: 140px 140px, 190px 190px, 160px 160px, 220px 220px;
      animation: starsMove 12s linear infinite;
    }

    .intro-stage .paper {
      position: absolute;
      inset-block: 0;
      width: 50.5%;
      background: linear-gradient(145deg, #17243b, #0b1020 80%);
      border: 1px solid #f3c96930;
      box-shadow: 0 0 60px #0008;
      transition: transform 1.65s cubic-bezier(.76, 0, .24, 1);
      overflow: hidden;
    }

    .intro-stage .right-paper {
      right: 0;
      transform-origin: right center;
    }

    .intro-stage .left-paper {
      left: 0;
      transform-origin: left center;
    }

    .intro-stage .paper-face {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, #f3c9690d, transparent 70%),
        linear-gradient(135deg, #111a2e, #090e1b);
    }

    .intro-stage .welcome-content {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(80%, 420px);
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .intro-stage .welcome-title {
      font-size: clamp(25px, 5vw, 48px);
      color: var(--gold);
      margin: 0 0 12px;
    }

    .intro-stage .welcome-sub {
      font-size: clamp(18px, 3vw, 26px);
      margin: 0 0 10px;
    }

    .intro-stage .welcome-desc {
      color: var(--muted);
      font-size: 14px;
    }

    .bismillah-layer {
      position: relative;
      z-index: 2;
      width: min(92%, 900px);
      text-align: center;
      transition: opacity .5s ease, transform .5s ease;
    }

    .bismillah-ar {
      font-size: clamp(23px, 4.7vw, 47px);
      line-height: 1.9;
      margin: 0;
      color: var(--gold2);
      text-shadow: 0 0 28px #f3c96935;
      animation: bismillahGlow 2.6s ease-in-out infinite alternate;
    }

    .bismillah-fa {
      font-size: clamp(14px, 2.2vw, 20px);
      color: #fff;
      margin: 12px 0 0;
    }

    .bismillah-en {
      direction: ltr;
      font-size: clamp(12px, 1.8vw, 17px);
      color: #b8c4d8;
      margin: 8px 0 0;
    }

    .bismillah-layer.hide {
      opacity: 0;
      transform: translateY(-12px);
      pointer-events: none;
    }

    .intro-stage.tear .right-paper {
      transform: translateX(102%);
    }

    .intro-stage.tear .left-paper {
      transform: translateX(-102%);
    }

    .enter-wrap {
      position: fixed;
      inset-inline: 0;
      bottom: 10%;
      z-index: 10001;
      display: flex;
      justify-content: center;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: opacity .6s ease, transform .6s ease;
    }

    .enter-wrap.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .enter-btn {
      padding: 12px 27px;
      border: 1px solid #ffe6a0;
      border-radius: 999px;
      background: linear-gradient(135deg, #f3c969, #ffe6a0);
      color: #121827;
      font-weight: bold;
      box-shadow: 0 8px 35px #f3c96930;
    }

    .skip-intro {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10002;
      color: #fff;
      background: #ffffff14;
      border: 1px solid #ffffff30;
      border-radius: 10px;
      padding: 7px 13px;
    }

    .skip-intro:hover {
      background: #ffffff25;
    }

    .site {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0b1020ed;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      max-width: 1400px;
      min-height: 72px;
      padding: 10px 18px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold), #a77c2a);
      color: #10182a;
      font-weight: 900;
      font-size: 25px;
      box-shadow: 0 4px 18px #f3c96925;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 900;
      color: var(--gold);
      line-height: 1.4;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
      color: var(--text);
      font-size: 19px;
    }

    .icon-btn:hover {
      border-color: var(--gold);
    }

    .header-profile {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
    }

    .menu-panel {
      display: none;
      border-top: 1px solid var(--border);
      background: #0d1425;
      padding: 12px 18px;
    }

    .menu-panel.open {
      display: block;
    }

    .menu-links {
      max-width: 1400px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .menu-links a {
      color: var(--muted);
      padding: 7px 11px;
      border-radius: 9px;
      background: #ffffff06;
    }

    .menu-links a:hover {
      color: var(--gold);
      background: #f3c96912;
    }

    /* NOTE: Full original content continues - this is a partial to avoid truncation. Full restore requires the complete file. */
  </style>
</head>

</body>
</html>
